<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Green rounded square background -->
  <rect width="32" height="32" rx="8" fill="#22C55E"/>
  <!-- Dumbbell bar -->
  <rect x="5" y="14.5" width="22" height="3" rx="1.5" fill="rgba(255,255,255,0.3)"/>
  <!-- Left weight plate -->
  <rect x="3" y="10" width="6" height="12" rx="2" fill="rgba(255,255,255,0.9)"/>
  <!-- Right weight plate -->
  <rect x="23" y="10" width="6" height="12" rx="2" fill="rgba(255,255,255,0.9)"/>
  <!-- S letter -->
  <text x="16" y="22" text-anchor="middle" font-family="Arial Black, Poppins, sans-serif" font-weight="900" font-size="14" fill="white" letter-spacing="-0.5">S</text>
</svg>
